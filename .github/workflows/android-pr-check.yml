name: Android PR Check

on:
  pull_request:
    branches: [ main, dev, develop ]
  push:
    branches: [ main, dev, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Decode google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          echo $GOOGLE_SERVICES_JSON | base64 -d > app/google-services.json
        else
          echo "Warning: GOOGLE_SERVICES_JSON secret not found. Using existing file if present."
        fi
        
    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Run lint
      run: ./gradlew lintDebug
      continue-on-error: true
      
    - name: Run unit tests
      run: ./gradlew testDebugUnitTest
      continue-on-error: true
      
    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
        
    - name: Upload lint reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-results
        path: app/build/reports/lint-results-debug.html
        retention-days: 7
        
    - name: Comment PR with build status
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const buildStatus = '${{ job.status }}';
          const message = buildStatus === 'success' 
            ? '✅ Android build successful!' 
            : '❌ Android build failed. Please check the logs.';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `${message}\n\nCommit: ${context.sha}`
          });

